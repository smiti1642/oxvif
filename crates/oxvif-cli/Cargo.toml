[package]
name = "oxvif-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Human- and Agent-friendly CLI for ONVIF cameras"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "schema/**"]
keywords = ["onvif", "camera", "cli", "rtsp"]
categories = ["command-line-utilities", "network-programming", "multimedia"]

[[bin]]
name = "oxvif"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
directories = "6"
fs2 = "0.4.3"
ipnet = "2.11"
oxvif = { version = "0.16.0", path = "../..", features = ["health", "serde"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7.5.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.0"
url = "2.5"
unicode-width = "0.2.2"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
jsonschema = { version = "0.52.1", default-features = false }
oxvif = { path = "../..", features = ["mock-server"] }
tempfile = "3"
shlex = "1.3"
