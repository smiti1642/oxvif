[package]
name = "oxvif-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Human- and Agent-friendly CLI for ONVIF cameras"
readme = "README.md"
keywords = ["onvif", "camera", "cli", "rtsp"]
categories = ["command-line-utilities", "network-programming", "multimedia"]

[[bin]]
name = "oxvif"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
directories = "6"
fs2 = "0.4.3"
ipnet = "2.11"
oxvif = { version = "0.16.0", path = "../..", features = ["health", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rpassword = "7.5.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
oxvif = { path = "../..", features = ["mock-server"] }
tempfile = "3"
