name: CI

on:
  push:
    branches: [master, develop, codex/mock-fidelity-hardening]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mock-inventory:
    name: Mock inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Action, handler, reader and bilingual inventory
        shell: pwsh
        run: ./docs/active/check-mock-fidelity-inventory.ps1 -SelfTest

  schema-tooling:
    name: Schema tooling controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Qualify generic verifier controls (no official schemas)
        shell: pwsh
        run: |
          $verificationEnv = Join-Path $env:RUNNER_TEMP 'oxvif-schema-tooling'
          python -m venv $verificationEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verificationPython = if ($IsWindows) { Join-Path $verificationEnv 'Scripts/python.exe' } else { Join-Path $verificationEnv 'bin/python' }
          & $verificationPython -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/schema-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verificationPython -m unittest discover -s packaging -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verificationTool = Join-Path $env:RUNNER_TEMP 'oxvif-xerces-tool'
          & $verificationPython packaging/verify_schemas_xerces.py fetch-tool --tool-root $verificationTool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verificationPython packaging/qualify_xerces.py --tool-root $verificationTool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  schema-source-compilation:
    name: Official schemas and selected profile corpus (${{ matrix.os }})
    needs: [schema-tooling]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile pinned external schema closure (no artifacts)
        shell: pwsh
        run: |
          $verificationEnv = Join-Path $env:RUNNER_TEMP 'oxvif-schema-env'
          $verificationSources = Join-Path $env:RUNNER_TEMP 'oxvif-schema-sources'
          $verificationTool = Join-Path $env:RUNNER_TEMP 'oxvif-xerces-tool'
          python -m venv $verificationEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verificationPython = if ($IsWindows) { Join-Path $verificationEnv 'Scripts/python.exe' } else { Join-Path $verificationEnv 'bin/python' }
          & $verificationPython -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/schema-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verificationPython packaging/verify_schemas.py fetch --root $verificationSources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verificationPython packaging/verify_schemas_xerces.py fetch-tool --tool-root $verificationTool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verificationPython packaging/verify_schemas_xerces.py compile --root $verificationSources --tool-root $verificationTool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install stable toolchain for synthetic exchange capture
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Export and validate selected profile exchanges (not whole-program acceptance)
        shell: pwsh
        run: |
          $verificationEnv = Join-Path $env:RUNNER_TEMP 'oxvif-schema-env'
          $verificationPython = if ($IsWindows) { Join-Path $verificationEnv 'Scripts/python.exe' } else { Join-Path $verificationEnv 'bin/python' }
          $verificationSources = Join-Path $env:RUNNER_TEMP 'oxvif-schema-sources'
          $verificationTool = Join-Path $env:RUNNER_TEMP 'oxvif-xerces-tool'
          $env:OXVIF_MOCK_CORPUS = Join-Path $env:RUNNER_TEMP 'oxvif-profile-corpus'
          cargo test --locked --features mock --test mock_schema_corpus export_first_profile_batch_for_independent_validation -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $verificationPython packaging/verify_schemas_xerces.py validate --root $verificationSources --tool-root $verificationTool --corpus $env:OXVIF_MOCK_CORPUS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check downstream XML feature compatibility
        run: |
          cargo fetch --locked
          python3 packaging/check_xml_features.py
      - name: Test packaging acceptance checks
        run: |
          python3 -m venv "$RUNNER_TEMP/oxvif-packaging-controls"
          "$RUNNER_TEMP/oxvif-packaging-controls/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r packaging/schema-requirements.txt
          "$RUNNER_TEMP/oxvif-packaging-controls/bin/python" -m unittest discover -s packaging -p 'test_*.py'

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c # cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check workspace at MSRV
        run: cargo check --workspace --all-features --locked

  test:
    name: Tests (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  cli-smoke:
    name: CLI smoke (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release CLI
        run: cargo build -p oxvif-cli --release --locked
      - name: Smoke public surfaces (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/oxvif
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" describe device.info --output json >/dev/null
          "$bin" agent guide --output json >/dev/null
          set +e
          parse_error=$("$bin" --output json definitely-not-a-command)
          parse_status=$?
          set -e
          test "$parse_status" -eq 2
          grep -q 'INVALID_ARGUMENT' <<<"$parse_error"
          for shell in bash zsh fish powershell; do
            "$bin" completion "$shell" >/dev/null
          done
      - name: Smoke public surfaces (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'target/release/oxvif.exe'
          & $bin --version
          & $bin --help | Out-Null
          & $bin describe device.info --output json | Out-Null
          & $bin agent guide --output json | Out-Null
          $parseError = & $bin --output json definitely-not-a-command
          if ($LASTEXITCODE -ne 2) { throw 'structured parse failure returned the wrong exit code' }
          $document = $parseError | ConvertFrom-Json
          if ($document.error.code -ne 'INVALID_ARGUMENT') { throw 'structured parse failure returned the wrong code' }
          foreach ($shell in @('bash', 'zsh', 'fish', 'powershell')) {
            & $bin completion $shell | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "completion generation failed for $shell" }
          }

  credential-contract:
    name: Native credentials (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify unavailable Secret Service mapping (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: env -u DBUS_SESSION_BUS_ADDRESS cargo test -p oxvif-cli system_store_unavailable_contract --locked -- --ignored
      - name: Start an isolated Secret Service (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'oxvif-ci'
      - name: Verify native credential lifecycle
        run: cargo test -p oxvif-cli system_store_contract --locked -- --ignored

  package:
    name: Package and docs
    needs: [mock-inventory, schema-tooling, schema-source-compilation, audit, msrv, test, cli-smoke, credential-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify library package
        run: cargo package -p oxvif --locked
      - name: Verify CLI package contents
        run: cargo package -p oxvif-cli --locked --list
      - name: Verify deterministic release archive tooling
        shell: bash
        run: |
          set -euo pipefail
          archive_test_dir="$RUNNER_TEMP/oxvif-archive-test"
          mkdir -p "$archive_test_dir"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 packaging/create_archive.py --format tar.gz --source packaging --output "$archive_test_dir/one.tar.gz" --epoch "$source_date_epoch"
          python3 packaging/create_archive.py --format tar.gz --source packaging --output "$archive_test_dir/two.tar.gz" --epoch "$source_date_epoch"
          python3 packaging/create_archive.py --format zip --source packaging --output "$archive_test_dir/one.zip" --epoch "$source_date_epoch"
          python3 packaging/create_archive.py --format zip --source packaging --output "$archive_test_dir/two.zip" --epoch "$source_date_epoch"
          cmp "$archive_test_dir/one.tar.gz" "$archive_test_dir/two.tar.gz"
          cmp "$archive_test_dir/one.zip" "$archive_test_dir/two.zip"
      - name: Build library documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p oxvif --all-features --no-deps --locked
      - name: Build CLI documentation
        env:
          CARGO_TARGET_DIR: target/doc-cli
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p oxvif-cli --all-features --no-deps --locked
