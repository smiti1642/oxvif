name: Prepare release artifacts

on:
  push:
    branches: [develop]
    paths:
      - packaging/**
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag when publishing; filename-safe branch/SHA allowed only for publish=false staging
        required: true
        type: string
      publish:
        description: Create the public GitHub Release after all artifact jobs pass
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  RELEASE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - name: Install pinned release toolchain
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify tag and declared versions
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ env.RELEASE_LABEL }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release ref must be filename-safe (letters, digits, dot, underscore, or hyphen)." >&2
            exit 1
          fi
          git rev-parse --verify HEAD
          library_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "oxvif"))')
          cli_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "oxvif-cli"))')
          grep -Fq "## [$library_version]" CHANGELOG.md
          grep -Fq "# oxvif $library_version" "docs/releases/$library_version.md"
          grep -Fq "version = \"$cli_version\"" crates/oxvif-cli/Cargo.toml
          if [ "$PUBLISH" = "true" ]; then
            git rev-parse --verify "refs/tags/$RELEASE_TAG"
            test "$RELEASE_TAG" = "v$library_version"
            if grep -Fq "## [$library_version] - Unreleased" CHANGELOG.md; then
              echo "CHANGELOG still marks $library_version as unreleased" >&2
              exit 1
            fi
            if grep -Fq "Status: Unreleased" "docs/releases/$library_version.md"; then
              echo "release note still marks $library_version as unreleased" >&2
              exit 1
            fi
          fi
          cargo run -q -p oxvif-cli -- agent guide --output json --non-interactive |
            python3 -c 'import json,sys; d=json.load(sys.stdin); g=d["data"]["guide"]; assert g["cli_version"] == sys.argv[1]; assert g["schema_version"] == d["schema_version"]; assert g["guide_version"]' "$cli_version"
      - name: Run release gates
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo package -p oxvif --locked
          if [ "$PUBLISH" = "true" ]; then
            cargo package -p oxvif-cli --locked
          else
            cargo package -p oxvif-cli --locked --list
          fi
      - name: Install cargo-audit
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c # cargo-audit
      - name: Security audit
        run: cargo audit
      - name: Upload versioned JSON schemas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxvif-json-schema-v3
          path: crates/oxvif-cli/schema/*.json
          if-no-files-found: error
          retention-days: 14

  native-credentials:
    name: Native credentials (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pinned release toolchain
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify unavailable Secret Service mapping (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: env -u DBUS_SESSION_BUS_ADDRESS cargo test -p oxvif-cli system_store_unavailable_contract --locked -- --ignored
      - name: Start an isolated Secret Service (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'oxvif-release-ci'
      - name: Verify native credential lifecycle
        run: cargo test -p oxvif-cli system_store_contract --locked -- --ignored

  build:
    name: Build ${{ matrix.archive }}
    needs: [verify, native-credentials]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: oxvif-linux-x86_64
            deb_arch: amd64
            shell: bash
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: oxvif-linux-aarch64
            deb_arch: arm64
            shell: bash
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: oxvif-windows-x86_64
            deb_arch: none
            shell: pwsh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: oxvif-macos-x86_64
            deb_arch: none
            shell: bash
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: oxvif-macos-aarch64
            deb_arch: none
            shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install pinned release toolchain
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build -p oxvif-cli --release --locked --target ${{ matrix.target }}
      - name: Smoke release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/oxvif"
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" describe device.info --output json --non-interactive >/dev/null
          "$bin" agent guide --output json --non-interactive >/dev/null
      - name: Smoke release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/$env:TARGET/release/oxvif.exe"
          & $bin --version
          & $bin --help | Out-Null
          & $bin describe device.info --output json --non-interactive | Out-Null
          & $bin agent guide --output json --non-interactive | Out-Null
      - name: Package archive and checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}-${{ env.RELEASE_LABEL }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCHIVE_NAME/completions" "dist/$ARCHIVE_NAME/schema" "dist/$ARCHIVE_NAME/metadata"
          cp "target/$TARGET/release/oxvif" "dist/$ARCHIVE_NAME/"
          cp README.md LICENSE "dist/$ARCHIVE_NAME/"
          cp crates/oxvif-cli/README.md "dist/$ARCHIVE_NAME/CLI-README.md"
          cp packaging/oxvif.1 "dist/$ARCHIVE_NAME/"
          cp crates/oxvif-cli/schema/*.json "dist/$ARCHIVE_NAME/schema/"
          "target/$TARGET/release/oxvif" --version > "dist/$ARCHIVE_NAME/metadata/version.txt"
          "target/$TARGET/release/oxvif" agent guide --output json --non-interactive > "dist/$ARCHIVE_NAME/metadata/agent-guide.json"
          {
            rustc -Vv
            cargo -V
            python3 --version
          } > "dist/$ARCHIVE_NAME/metadata/build-tools.txt" 2>&1
          for shell in bash zsh fish powershell; do
            "target/$TARGET/release/oxvif" completion "$shell" > "dist/$ARCHIVE_NAME/completions/oxvif.$shell"
          done
          source_date_epoch=$(git show -s --format=%ct HEAD)
          python3 packaging/create_archive.py \
            --format tar.gz \
            --source "dist/$ARCHIVE_NAME" \
            --output "dist/$ARCHIVE_NAME.tar.gz" \
            --epoch "$source_date_epoch"
          (cd dist && shasum -a 256 "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256")
      - name: Package archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}-${{ env.RELEASE_LABEL }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "dist/$env:ARCHIVE_NAME"
          New-Item -ItemType Directory -Force "$root/completions" | Out-Null
          New-Item -ItemType Directory -Force "$root/schema" | Out-Null
          New-Item -ItemType Directory -Force "$root/metadata" | Out-Null
          Copy-Item "target/$env:TARGET/release/oxvif.exe" $root
          Copy-Item README.md, LICENSE $root
          Copy-Item "crates/oxvif-cli/README.md" "$root/CLI-README.md"
          Copy-Item "packaging/oxvif.1" $root
          Copy-Item "crates/oxvif-cli/schema/*.json" "$root/schema"
          $bin = "target/$env:TARGET/release/oxvif.exe"
          & $bin --version | Out-File -Encoding utf8 "$root/metadata/version.txt"
          & $bin agent guide --output json --non-interactive | Out-File -Encoding utf8 "$root/metadata/agent-guide.json"
          & rustc -Vv | Out-File -Encoding utf8 "$root/metadata/build-tools.txt"
          & cargo -V | Out-File -Encoding utf8 -Append "$root/metadata/build-tools.txt"
          & python --version 2>&1 | Out-File -Encoding utf8 -Append "$root/metadata/build-tools.txt"
          foreach ($shell in @('bash', 'zsh', 'fish', 'powershell')) {
            & $bin completion $shell | Out-File -Encoding utf8 "$root/completions/oxvif.$shell"
          }
          $sourceDateEpoch = git show -s --format=%ct HEAD
          python packaging/create_archive.py `
            --format zip `
            --source $root `
            --output "dist/$env:ARCHIVE_NAME.zip" `
            --epoch $sourceDateEpoch
          $hash = (Get-FileHash "dist/$env:ARCHIVE_NAME.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE_NAME.zip" | Out-File -Encoding ascii "dist/$env:ARCHIVE_NAME.zip.sha256"
      - name: Build, lint, install, and remove Debian package
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          cli_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "oxvif-cli"))')
          package_root="dist/deb-root-$DEB_ARCH"
          install -Dm755 "target/$TARGET/release/oxvif" "$package_root/usr/bin/oxvif"
          install -Dm644 LICENSE "$package_root/usr/share/doc/oxvif/copyright"
          install -Dm644 README.md "$package_root/usr/share/doc/oxvif/README.md"
          install -Dm644 crates/oxvif-cli/README.md "$package_root/usr/share/doc/oxvif/CLI-README.md"
          install -Dm644 packaging/oxvif.1 "$package_root/usr/share/man/man1/oxvif.1"
          gzip -n -9 "$package_root/usr/share/man/man1/oxvif.1"
          gzip -n -9 -c CHANGELOG.md > "$package_root/usr/share/doc/oxvif/changelog.gz"
          release_date=$(date -u -R -d "@$SOURCE_DATE_EPOCH")
          sed \
            -e "s/@CLI_VERSION@/$cli_version/g" \
            -e "s/@RELEASE_DATE@/$release_date/g" \
            packaging/debian/changelog.in \
            | gzip -n -9 > "$package_root/usr/share/doc/oxvif/changelog.Debian.gz"
          mkdir -p "$package_root/usr/share/bash-completion/completions"
          mkdir -p "$package_root/usr/share/zsh/vendor-completions"
          mkdir -p "$package_root/usr/share/fish/vendor_completions.d"
          mkdir -p "$package_root/usr/share/oxvif/completions" "$package_root/usr/share/oxvif/schema"
          "$package_root/usr/bin/oxvif" completion bash > "$package_root/usr/share/bash-completion/completions/oxvif"
          "$package_root/usr/bin/oxvif" completion zsh > "$package_root/usr/share/zsh/vendor-completions/_oxvif"
          "$package_root/usr/bin/oxvif" completion fish > "$package_root/usr/share/fish/vendor_completions.d/oxvif.fish"
          "$package_root/usr/bin/oxvif" completion powershell > "$package_root/usr/share/oxvif/completions/oxvif.ps1"
          cp crates/oxvif-cli/schema/*.json "$package_root/usr/share/oxvif/schema/"
          strip --strip-unneeded "$package_root/usr/bin/oxvif"
          installed_size=$(du -sk "$package_root" | cut -f1)
          mkdir -p "$package_root/DEBIAN"
          sed \
            -e "s/@CLI_VERSION@/$cli_version/g" \
            -e "s/@DEB_ARCH@/$DEB_ARCH/g" \
            -e "s/@INSTALLED_SIZE@/$installed_size/g" \
            packaging/debian/control.in > "$package_root/DEBIAN/control"
          deb="dist/oxvif_${cli_version}-1_${DEB_ARCH}.deb"
          dpkg-deb --root-owner-group --build "$package_root" "$deb"
          sudo apt-get update
          sudo apt-get install -y lintian
          {
            dpkg-deb --version | head -n 1
            lintian --version
            strip --version | head -n 1
          } > "dist/oxvif_${cli_version}-1_${DEB_ARCH}.build-tools.txt"
          lintian --fail-on error "$deb"
          sudo apt-get install -y "./$deb"
          /usr/bin/oxvif --version
          /usr/bin/oxvif describe device.info --output json --non-interactive >/dev/null
          /usr/bin/oxvif agent guide --output json --non-interactive >/dev/null
          test -r /usr/share/man/man1/oxvif.1.gz
          test -r /usr/share/oxvif/schema/oxvif-envelope.schema.json
          test -r /usr/share/oxvif/schema/command-descriptor.schema.json
          sudo apt-get remove -y oxvif
          test ! -e /usr/bin/oxvif
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/${{ matrix.target }}/release
          artifact-name: ${{ matrix.archive }}-${{ env.RELEASE_LABEL }}-sbom.spdx.json
          output-file: dist/${{ matrix.archive }}-${{ env.RELEASE_LABEL }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate build provenance
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
      - name: Upload prepared artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}-${{ env.RELEASE_LABEL }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.sha256
            dist/*.spdx.json
            dist/*.build-tools.txt
          if-no-files-found: error
          retention-days: 14

  prepare-homebrew-formula:
    name: Prepare project-tap formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Render and syntax-check formula
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_LABEL }}
        run: |
          set -euo pipefail
          cli_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "oxvif-cli"))')
          arm_archive="oxvif-macos-aarch64-$RELEASE_TAG.tar.gz"
          intel_archive="oxvif-macos-x86_64-$RELEASE_TAG.tar.gz"
          arm_sha=$(sha256sum "dist/$arm_archive" | cut -d' ' -f1)
          intel_sha=$(sha256sum "dist/$intel_archive" | cut -d' ' -f1)
          base_url="https://github.com/smiti1642/oxvif/releases/download/$RELEASE_TAG"
          mkdir -p formula
          sed \
            -e "s|@CLI_VERSION@|$cli_version|g" \
            -e "s|@MACOS_ARM64_URL@|$base_url/$arm_archive|g" \
            -e "s|@MACOS_ARM64_SHA256@|$arm_sha|g" \
            -e "s|@MACOS_X86_64_URL@|$base_url/$intel_archive|g" \
            -e "s|@MACOS_X86_64_SHA256@|$intel_sha|g" \
            packaging/homebrew/oxvif.rb.in > formula/oxvif.rb
          ruby -c formula/oxvif.rb
          ! grep -q '@[A-Z_]*@' formula/oxvif.rb
      - name: Upload formula staging artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxvif-homebrew-formula-${{ env.RELEASE_LABEL }}
          path: formula/oxvif.rb
          if-no-files-found: error
          retention-days: 14

  test-homebrew-formula:
    name: Homebrew install and bottle (${{ matrix.runner }})
    needs: prepare-homebrew-formula
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            archive: oxvif-macos-aarch64
          - runner: macos-15-intel
            archive: oxvif-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oxvif-homebrew-formula-${{ env.RELEASE_LABEL }}
          path: formula
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.archive }}-${{ env.RELEASE_LABEL }}
          path: dist
      - name: Install through Homebrew, create a bottle, and reinstall it
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}-${{ env.RELEASE_LABEL }}.tar.gz
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          archive_sha=$(shasum -a 256 "dist/$ARCHIVE_NAME" | cut -d' ' -f1)
          local_url="http://127.0.0.1:18080/$ARCHIVE_NAME"
          LOCAL_URL="$local_url" ARCHIVE_SHA="$archive_sha" python3 - <<'PY'
          import os
          import pathlib
          import re

          formula = pathlib.Path("formula/oxvif.rb")
          text = formula.read_text(encoding="utf-8")
          text = re.sub(r'url "[^"]+"', f'url "{os.environ["LOCAL_URL"]}"', text)
          text = re.sub(r'sha256 "[0-9a-f]+"', f'sha256 "{os.environ["ARCHIVE_SHA"]}"', text)
          formula.write_text(text, encoding="utf-8")
          PY
          ruby -c formula/oxvif.rb
          brew style formula/oxvif.rb
          python3 -m http.server 18080 --bind 127.0.0.1 --directory dist >brew-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 "$local_url" --output /dev/null
          brew install --build-bottle --formula formula/oxvif.rb
          oxvif --version
          oxvif describe device.info --output json --non-interactive >/dev/null
          oxvif agent guide --output json --non-interactive >/dev/null
          brew bottle --json oxvif > oxvif-bottle.json
          bottle=$(find . -maxdepth 1 -type f -name 'oxvif--*.bottle*.tar.gz' -print -quit)
          test -n "$bottle"
          brew uninstall oxvif
          brew install "$bottle"
          oxvif --version
          oxvif describe device.info --output json --non-interactive >/dev/null
          oxvif agent guide --output json --non-interactive >/dev/null
          brew uninstall oxvif
          ! command -v oxvif
      - name: Upload staged Homebrew bottle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxvif-homebrew-bottle-${{ matrix.archive }}-${{ env.RELEASE_LABEL }}
          path: |
            oxvif--*.bottle*.tar.gz
            oxvif-bottle.json
          if-no-files-found: error
          retention-days: 14

  prepare-apt-repository:
    name: Prepare signed APT repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oxvif-linux-*-${{ env.RELEASE_LABEL }}
          path: dist
          merge-multiple: true
      - name: Build and sign repository metadata with an ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg
          repository="$RUNNER_TEMP/oxvif-apt-repository"
          mkdir -p "$repository/pool/main/o/oxvif"
          cp dist/*.deb "$repository/pool/main/o/oxvif/"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key \
            'oxvif CI repository <ci-only@oxvif.invalid>' ed25519 sign 1d
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          bash packaging/debian/build-repository.sh "$repository" stable "$fingerprint"
          gpg --batch --export "$fingerprint" > "$repository/oxvif-archive-keyring.gpg"
          gpg --batch --armor --export "$fingerprint" > "$repository/oxvif-archive-key.asc"
          printf '%s\n' "$fingerprint" > "$repository/oxvif-archive-key.fingerprint"
          gpgv --keyring "$repository/oxvif-archive-keyring.gpg" \
            "$repository/dists/stable/InRelease"
          cp "$repository/dists/stable/InRelease" "$RUNNER_TEMP/InRelease.tampered"
          sed -i 's/Origin: oxvif/Origin: tampered/' "$RUNNER_TEMP/InRelease.tampered"
          if gpgv --keyring "$repository/oxvif-archive-keyring.gpg" \
            "$RUNNER_TEMP/InRelease.tampered"; then
            echo "tampered repository metadata unexpectedly verified" >&2
            exit 1
          fi
          mv "$repository" repository
      - name: Upload signed APT staging repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxvif-apt-repository-${{ env.RELEASE_LABEL }}
          path: repository
          if-no-files-found: error
          retention-days: 14

  test-apt-repository:
    name: APT repository install (${{ matrix.architecture }})
    needs: prepare-apt-repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oxvif-apt-repository-${{ env.RELEASE_LABEL }}
          path: repository
      - name: Install and remove through the signed repository
        shell: bash
        env:
          DEB_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = "$DEB_ARCH"
          sudo install -Dm644 repository/oxvif-archive-keyring.gpg \
            /usr/share/keyrings/oxvif-staging.gpg
          printf 'deb [arch=%s signed-by=/usr/share/keyrings/oxvif-staging.gpg] http://127.0.0.1:18081 stable main\n' \
            "$DEB_ARCH" | sudo tee /etc/apt/sources.list.d/oxvif-staging.list >/dev/null
          python3 -m http.server 18081 --bind 127.0.0.1 --directory repository >apt-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; sudo rm -f /etc/apt/sources.list.d/oxvif-staging.list /usr/share/keyrings/oxvif-staging.gpg' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18081/dists/stable/InRelease --output /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y oxvif
          test "$(dpkg-query -W -f='${Architecture}' oxvif)" = "$DEB_ARCH"
          /usr/bin/oxvif --version
          /usr/bin/oxvif describe device.info --output json --non-interactive >/dev/null
          /usr/bin/oxvif agent guide --output json --non-interactive >/dev/null
          test -r /usr/share/bash-completion/completions/oxvif
          test -r /usr/share/zsh/vendor-completions/_oxvif
          test -r /usr/share/fish/vendor_completions.d/oxvif.fish
          test -r /usr/share/man/man1/oxvif.1.gz
          test -r /usr/share/oxvif/schema/oxvif-envelope.schema.json
          test -r /usr/share/oxvif/schema/command-descriptor.schema.json
          sudo apt-get purge -y oxvif
          test ! -e /usr/bin/oxvif

  publish-github-release:
    name: Publish GitHub Release
    if: inputs.publish
    needs:
      - build
      - test-homebrew-formula
      - test-apt-repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads
      - name: Select public release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' asset; do
            cp "$asset" dist/
          done < <(
            find downloads -type f \( \
              -name '*.tar.gz' -o \
              -name '*.zip' -o \
              -name '*.deb' -o \
              -name '*.sha256' -o \
              -name '*.spdx.json' -o \
              -name '*.build-tools.txt' -o \
              -name 'oxvif.rb' \
            \) -print0
          )
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
      - name: Create public release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_LABEL }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "oxvif $version" \
            --notes-file "docs/releases/$version.md" \
            "${prerelease_flag[@]}"
